name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # version comes from package.json#packageManager (pnpm@9.15.9)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      # Annual Budget gate (COMP-17): fails once curated SARS tables for the live
      # tax year are missing. Runbook: docs/ANNUAL_TAX_TABLE_UPDATE.md
      - name: Verify SARS tax tables are current
        run: pnpm check:tax-tables

      # COMP-18: parallel-run regression vs hand-calculated SARS figures (all years).
      - name: SARS compliance regression (parallel run)
        run: pnpm check:sars-compliance

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # version comes from package.json#packageManager (pnpm@9.15.9)
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          # Keep CI aligned with package.json#engines, .nvmrc, and Vercel.
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      # Annual Budget gate (COMP-17): fails once curated SARS tables for the live
      # tax year are missing. Runbook: docs/ANNUAL_TAX_TABLE_UPDATE.md
      - name: Verify SARS tax tables are current
        run: pnpm check:tax-tables

      # COMP-18: parallel-run regression vs hand-calculated SARS figures (all years).
      - name: SARS compliance regression (parallel run)
        run: pnpm check:sars-compliance

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 25
    env:
      CI: true
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_MANAGER_EMAIL: ${{ secrets.E2E_MANAGER_EMAIL }}
      E2E_MANAGER_PASSWORD: ${{ secrets.E2E_MANAGER_PASSWORD }}
      E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
      E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check E2E credentials
        id: e2e-creds
        run: |
          if [ -n "$E2E_EMAIL" ] && [ -n "$E2E_PASSWORD" ] && [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::E2E CI skipped — add GitHub secrets (see docs/E2E_CI.md)."
          fi

      - name: Install Playwright Chromium
        if: steps.e2e-creds.outputs.configured == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E
        if: steps.e2e-creds.outputs.configured == 'true'
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure() && steps.e2e-creds.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
